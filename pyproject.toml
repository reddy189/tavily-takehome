[project]
name = "tavily-research-agent"
version = "0.1.0"
description = "Grounded, citation-verified research pipeline built on Tavily search"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0.0",
    "langchain-nebius>=0.1.0",
    "tavily-python>=0.7.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
tracing = [
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
